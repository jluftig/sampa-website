<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Membership conversion</title>
</head>
<body>
<script>
(function () {
  var TAG_ID = 'AW-18372431189';
  var PARENT = 'https://www.addictionpas.org';
  var fired = false;

  function clickOk(value) {
    return typeof value === 'string' && /^[\w-]{1,200}$/.test(value);
  }

  function stamp(name, value) {
    if (!clickOk(value)) return;
    var seconds = Math.floor(Date.now() / 1000);
    try {
      document.cookie = name + '=GCL.' + seconds + '.' + value + '; Path=/; SameSite=Lax; Secure';
    } catch (error) { /* cookie write can fail; the hit still carries the click id */ }
  }

  window.addEventListener('message', function (event) {
    if (fired) return;
    if (event.origin !== PARENT) return;
    var body = event.data;
    if (!body || body.source !== 'sampa-membership-conversion') return;
    var payload = body.payload || {};
    if (payload.gpc === true || payload.optOut === true || payload.consent !== 'granted') return;
    if (payload.tagId !== TAG_ID) return;
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(payload.label || '')) return;
    if (!/^cs_(test|live)_[A-Za-z0-9]{8,}$/.test(payload.transactionId || '')) return;
    if (payload.currency !== 'USD') return;
    if (typeof payload.value !== 'number' || !isFinite(payload.value) || payload.value < 0) return;
    var packed = JSON.stringify(payload);
    if (packed.indexOf('@') !== -1) return;
    if (payload.user_data || payload.email || payload.phone || payload.address) return;

    fired = true;
    var url = new URL(window.location.href);
    ['gclid', 'gbraid', 'wbraid'].forEach(function (key) {
      if (clickOk(payload[key])) url.searchParams.set(key, payload[key]);
    });
    try { history.replaceState(null, '', url); } catch (error) { /* the hit still carries the click id */ }
    stamp('_gcl_aw', payload.gclid);
    stamp('_gcl_gb', payload.wbraid);
    stamp('_gcl_ag', payload.gbraid);

    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('consent', 'default', {
      ad_storage: 'denied',
      analytics_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    gtag('consent', 'update', {
      ad_storage: 'granted',
      analytics_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    gtag('js', new Date());
    gtag('config', TAG_ID, {
      allow_enhanced_conversions: false,
      send_page_view: false
    });
    gtag('event', 'conversion', {
      send_to: TAG_ID + '/' + payload.label,
      transaction_id: payload.transactionId,
      value: payload.value,
      currency: 'USD',
      gclid: clickOk(payload.gclid) ? payload.gclid : undefined,
      gbraid: clickOk(payload.gbraid) ? payload.gbraid : undefined,
      wbraid: clickOk(payload.wbraid) ? payload.wbraid : undefined
    });
    var script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(TAG_ID);
    document.head.appendChild(script);
  });
})();
</script>
</body>
</html>
