name: My SAMPA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:my-sampa

  policy-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:policy-work
      - run: npm run build
      - run: npm run test:policy-work-bundle
